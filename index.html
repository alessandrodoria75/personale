<style>
    :root {
        --card-size: 190px;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: "Segoe UI", Arial, sans-serif;
        background:
            radial-gradient(circle at 15% 20%, rgba(255,255,255,.25), transparent 30%),
            radial-gradient(circle at 85% 80%, rgba(0,180,255,.25), transparent 35%),
            linear-gradient(135deg, #101820, #243b55, #141e30);
        color: white;
        overflow-x: hidden;
    }

    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: linear-gradient(120deg, transparent, rgba(255,255,255,.08), transparent);
        animation: shine 8s infinite;
        pointer-events: none;
    }

    @keyframes shine {
        0%, 100% { transform: translateX(-100%); }
        50% { transform: translateX(100%); }
    }

    h1 {
        margin-bottom: 45px;
        font-size: clamp(32px, 5vw, 52px);
        letter-spacing: 3px;
        font-weight: 800;
        background: linear-gradient(90deg, #f6d365, #fda085, #f6d365);
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 8px 25px rgba(0,0,0,.35);
        animation: titleGlow 5s linear infinite;
    }

    @keyframes titleGlow {
        to {
            background-position: 200% center;
        }
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(4, var(--card-size));
        grid-template-rows: repeat(3, var(--card-size));
        gap: 38px;
    }

    .bookmark {
        position: relative;
        background: rgba(255,255,255,.13);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255,255,255,.28);
        border-radius: 28px;
        display: flex;
        justify-content: center;
        align-items: center;
        text-decoration: none;
        box-shadow:
            0 15px 35px rgba(0,0,0,.35),
            inset 0 1px 1px rgba(255,255,255,.3);
        transition: transform .3s ease, box-shadow .3s ease, background .3s ease;
        overflow: hidden;
    }

    .bookmark::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(255,255,255,.22), transparent 45%);
        opacity: .5;
    }

    .bookmark:hover {
        transform: translateY(-10px) scale(1.06);
        background: rgba(255,255,255,.24);
        box-shadow: 0 25px 50px rgba(0,0,0,.5);
    }

    .bookmark img {
        position: relative;
        z-index: 1;
        max-width: 105px;
        max-height: 105px;
        object-fit: contain;
        filter: drop-shadow(0 8px 12px rgba(0,0,0,.35));
        transition: transform .3s ease;
    }

    .bookmark:hover img {
        transform: scale(1.12);
    }

    .bookmark span {
        position: relative;
        z-index: 1;
        font-size: 16px;
        text-align: center;
        color: white;
        font-weight: 700;
    }

    @media (max-width: 650px) {
        :root {
            --card-size: 115px;
        }

        .grid {
            gap: 18px;
        }

        .bookmark img {
            max-width: 65px;
            max-height: 65px;
        }
    }
</style>
