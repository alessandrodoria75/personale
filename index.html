<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>I miei bookmarks</title>

<style>
    :root {
        --card-size: 140px;
    }

    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 30px 15px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        background:
            radial-gradient(circle at 15% 20%, rgba(255,255,255,.25), transparent 30%),
            radial-gradient(circle at 85% 80%, rgba(0,180,255,.25), transparent 35%),
            linear-gradient(135deg, #101820, #243b55, #141e30);
        color: white;
        overflow-x: hidden;
    }

    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: linear-gradient(120deg, transparent, rgba(255,255,255,.08), transparent);
        animation: shine 8s infinite;
        pointer-events: none;
    }

    @keyframes shine {
        0%, 100% { transform: translateX(-100%); }
        50% { transform: translateX(100%); }
    }

    h1 {
        margin-top: 10px;
        margin-bottom: 30px;
        font-size: clamp(26px, 5vw, 42px);
        letter-spacing: 2px;
        font-weight: 800;
        text-align: center;
        background: linear-gradient(90deg, #f6d365, #fda085, #f6d365);
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 8px 25px rgba(0,0,0,.35);
        animation: titleGlow 5s linear infinite;
    }

    @keyframes titleGlow {
        to {
            background-position: 200% center;
        }
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 20px;
        width: 100%;
        max-width: 700px;
        justify-items: center;
        padding-bottom: 40px;
    }

    .bookmark {
        position: relative;
        width: var(--card-size);
        height: var(--card-size);
        background: rgba(255,255,255,.13);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255,255,255,.28);
        border-radius: 24px;
        display: flex;
        justify-content: center;
        align-items: center;
        text-decoration: none;
        box-shadow:
            0 10px 25px rgba(0,0,0,.3),
            inset 0 1px 1px rgba(255,255,255,.3);
        transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
        overflow: hidden;
    }

    .bookmark::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(255,255,255,.22), transparent 45%);
        opacity: .5;
        pointer-events: none;
    }

    /* Gestione ottimizzata del tocco per iOS */
    .bookmark:active {
        transform: scale(0.94);
        background: rgba(255,255,255,.25);
    }

    .bookmark img {
        position: relative;
        z-index: 1;
        max-width: 75px;
        max-height: 75px;
        object-fit: contain;
        filter: drop-shadow(0 6px 10px rgba(0,0,0,.3));
    }

    .bookmark span {
        position: relative;
        z-index: 1;
        font-size: 15px;
        text-align: center;
        color: white;
        font-weight: 700;
    }

    /* Media query mirate per schermi piccoli */
    @media (max-width: 480px) {
        :root {
            --card-size: 105px;
        }
        .grid {
            gap: 15px;
        }
        .bookmark img {
            max-width: 55px;
            max-height: 55px;
        }
    }
</style>
</head>

<body>

<h1>I miei bookmarks!</h1>

<div class="grid">
    <!-- Prima riga -->
    <a class="bookmark" href="https://www.google.com" target="_blank" rel="noopener noreferrer">
        <img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" alt="Google">
    </a>

</html>
